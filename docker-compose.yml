version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentscore_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentscore
      POSTGRES_USER: agentscore_user
      POSTGRES_PASSWORD: agentscore_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentscore_user -d agentscore"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentscore_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentscore_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agentscore_user:agentscore_password@postgres:5432/agentscore
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-agentscore_production_secret_key_change_me}
      CORS_ORIGINS: http://localhost:3000
      STORAGE_PROVIDER: local
      STORAGE_BASE_DIR: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/storage

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: agentscore_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agentscore_user:agentscore_password@postgres:5432/agentscore
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-agentscore_production_secret_key_change_me}
      STORAGE_PROVIDER: local
      STORAGE_BASE_DIR: /app/storage
    volumes:
      - storage_data:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentscore_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  storage_data:
